    <title>Cogwheel — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Cogwheel FFGL source and effect for Resolume in your browser: a Spirograph, as a machine rather than a curve. A toothed ring, a wheel rolling in mesh with it and a pen in one of its holes, drawing in subtractive ink on paper. The plugin's own GLSL, ported to WebGL2 unedited, fed by a JavaScript port of its gear train, crank and pens that a check in its repository holds to the plugin's C++. A demo, not the plugin." />

      <noscript>
        <p>
          This demo runs the plugin's shaders and a port of its gear train in
          your browser, so it needs JavaScript and WebGL2. The plugin itself,
          its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/cogwheel">its repository</a>.
        </p>
      </noscript>
    </main>
