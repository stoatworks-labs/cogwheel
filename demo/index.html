  <body>
    <main id="demo">
      <noscript>
        <h1>Cogwheel</h1>
        <p>
          A Spirograph for Resolume and Resolve: a toothed ring, a wheel rolling
          round in mesh with it, and a pen in one of the wheel's holes. Nothing
          evaluates a curve. The ratio is two whole numbers because gears mesh,
          so 96 and 32 close in a single turn with three lobes, while 96 and 31
          take thirty-one turns and lay down ninety-six. Ink is subtractive, so
          two pens crossing go darker, the way they do on paper.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its gear train in
          your browser, so it needs JavaScript and WebGL2. The plugin itself,
          its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/cogwheel">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/cogwheel/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/cogwheel">Source on GitHub</a></li>
        </ul>
      </noscript>
